spring:
  application:
    name: seonchaksun

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/seonchaksun?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:seonchaksun}
    password: ${DB_PASSWORD:seonchaksun}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}


springdoc:
  swagger-ui:
    path: /swagger
    operations-sorter: method
    tags-sorter: alpha


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}


server:
  port: 8080